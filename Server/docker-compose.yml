version: "3.9"

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8004:8888"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - .:/app          # hot-reload khi dev; xóa dòng này khi production

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"     # bỏ dòng này nếu không cần expose Redis ra ngoài
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 10012009MinhTri
      MYSQL_DATABASE: website-khkt
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p10012009MinhTri"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"     # bỏ dòng này nếu không cần kết nối MySQL từ máy host
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  redis_data:
  mysql_data:
