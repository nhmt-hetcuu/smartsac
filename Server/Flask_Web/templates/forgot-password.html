<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khôi Phục Mật Khẩu — SmartSac</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
</head>
<body>
    {% if err_msg %}<script>alert("{{ err_msg }}");</script>{% endif %}

    <nav class="mono-nav">
        <a href="/" class="mono-nav-brand">⚡ SmartSac</a>
        <a href="{{ url_for('user_login') }}" class="mono-nav-back">← Đăng nhập</a>
    </nav>

    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p class="loading-text">Đang xử lý...</p>
    </div>

    <div id="view-auth" class="view">
        <div class="auth-container">
            <p class="auth-eyebrow">Tài khoản / Password Recovery</p>
            <h1 class="auth-title">Khôi<br>Phục</h1>
            <hr class="auth-rule">

            <p style="font-family:'Source Serif 4',Georgia,serif; font-size:0.92rem; color:var(--muted-fg); line-height:1.7; margin-bottom:28px;">
                Nhập email để nhận liên kết đặt lại mật khẩu.
            </p>

            <form id="auth-form" method="POST" action="{{ url_for('forgot_password') }}">
                <label for="rec-input">Email</label>
                <input type="email" id="rec-input" name="email" required placeholder="email@example.com">

                {% if turnstile_site_key %}
                <div class="turnstile-wrapper">
                    <div class="cf-turnstile"
                         data-sitekey="{{ turnstile_site_key }}"
                         data-theme="light"></div>
                </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-full">Gửi liên kết →</button>
                <button type="button" class="btn btn-outline w-full" style="margin-top: 10px;" onclick="window.location.href = BASE + '/login'">← Quay lại</button>
            </form>
        </div>
    </div>

    <script>
        var BASE = "{{ request.script_root }}";
        function resetLoadingState() {
            const loading = document.getElementById('loading');
            if (!loading) return;
            loading.classList.remove('show');
            loading.classList.add('hidden');
            document.body.classList.remove('loading');
            document.body.style.overflow = '';
        }

        window.addEventListener('load', () => {
            resetLoadingState();
            document.body.classList.add('loaded');
        });

        window.addEventListener('pageshow', () => { resetLoadingState(); });

        function showLoading(text = 'Đang xử lý...') {
            const loading = document.getElementById('loading');
            const loadingText = document.querySelector('.loading-text');
            if (loadingText) loadingText.textContent = text;
            loading.classList.remove('hidden');
            setTimeout(() => loading.classList.add('show'), 10);
        }

        document.getElementById('auth-form').addEventListener('submit', function (e) {
            var tsWidget = document.querySelector('.cf-turnstile');
            if (tsWidget) {
                var tsInput = document.querySelector('[name="cf-turnstile-response"]');
                if (!tsInput || !tsInput.value) {
                    e.preventDefault();
                    alert('Vui lòng hoàn thành xác minh bảo mật Cloudflare.');
                    return;
                }
            }
            showLoading('Đang gửi liên kết...');
        });
    </script>
</body>
</html>
